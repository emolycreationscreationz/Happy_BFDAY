<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Boyfriend's Day</title>
<meta name="description" content="A little surprise, made just for you.">
<meta name="theme-color" content="#1a0913">
<meta property="og:type" content="website">
<meta property="og:title" content="Happy Boyfriend's Day ♥">
<meta property="og:description" content="A little surprise, made just for you. Open it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29S3 20.5 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 20.5 16 29 16 29Z' fill='%23ff5c8d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<!-- ============ SVG sprite ============ -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3c8"/>
      <stop offset=".5" stop-color="#ff5c8d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c9"/>
      <stop offset=".5" stop-color="#f3c77a"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <radialGradient id="gWax" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ff7aa2"/>
      <stop offset=".55" stop-color="#d81b60"/>
      <stop offset="1" stop-color="#7a0c35"/>
    </radialGradient>
    <clipPath id="clipHeart" clipPathUnits="objectBoundingBox">
      <path d="M.5 .96C.5 .96 .03 .66 .03 .32A.24 .24 0 0 1 .5 .2A.24 .24 0 0 1 .97 .32C.97 .66 .5 .96 .5 .96Z"/>
    </clipPath>
    <clipPath id="clipProgress"><rect id="progressRect" x="0" y="32" width="32" height="32"/></clipPath>
  </defs>
  <symbol id="i-heart" viewBox="0 0 32 32"><path d="M16 29S3 20.5 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 20.5 16 29 16 29Z"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9S10.5 4 8 4a2.5 2.5 0 0 0 0 5M12 9s1.5-5 4-5a2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4zM8 4v16M16 4v16M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/></symbol>
</svg>

<!-- Floating hearts on the whole page -->
<canvas id="ambient" aria-hidden="true"></canvas>

<!-- ============ OPENING: envelope ============ -->
<div id="opener" class="opener">
  <div class="opener__glow" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <p class="opener__date" data-f="date"></p>

  <div class="envelope" id="envelope">
    <div class="envelope__back"></div>
    <div class="envelope__letter" id="envelopeLetter">
      <p class="envelope__letter-title" data-f="pageTitle"></p>
      <div class="envelope__typed" id="typed" aria-live="polite"></div>
      <button class="btn btn--glow envelope__go" id="openGifts" type="button">
        <svg><use href="#i-gift"/></svg><span data-f="openButton"></span>
      </button>
    </div>
    <div class="envelope__front">
      <p class="envelope__to" data-f="envelopeTo"></p>
      <p class="envelope__from" data-f="envelopeFrom"></p>
    </div>
    <div class="envelope__flap"></div>
    <button class="seal" id="seal" type="button" aria-label="Open the envelope">
      <span class="seal__ring"></span>
      <svg class="seal__wax" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 4C60 3 64 10 72 11S88 12 91 21 89 36 94 44 97 60 90 67 86 82 77 87 64 90 56 96 40 98 32 92 18 88 10 78 8 66 3 58 2 44 8 34 9 20 20 13 38 5 50 4Z" fill="url(#gWax)"/>
        <circle cx="50" cy="51" r="33" fill="none" stroke="#ffc2d4" stroke-opacity=".4" stroke-width="1.5"/>
        <use href="#i-heart" x="30" y="31" width="40" height="40" fill="#ffd6e2" fill-opacity=".9"/>
      </svg>
    </button>
  </div>

  <p class="opener__hint"><span data-f="envelopeHint"></span></p>
</div>

<main id="main">

  <!-- ============ HERO + WISHES ============ -->
  <section class="hero" id="hero">
    <div class="hero__rays" aria-hidden="true"></div>
    <p class="kicker reveal" data-f="heroKicker"></p>
    <h1 class="hero__title reveal">
      <span class="script" data-f="heroTitle"></span>
      <span class="hero__name shine" data-f="hisName"></span>
    </h1>
    <p class="hero__date reveal"><span class="line"></span><span data-f="date"></span><span class="line"></span></p>

    <div class="video-frame reveal" id="videoFrame">
      <div class="video-frame__inner" id="videoBox"></div>
      <button class="video-frame__sound" id="videoSound" type="button" aria-label="Turn sound on" hidden>
        <svg><use href="#i-mute"/></svg>
      </button>
      <span class="video-frame__heart video-frame__heart--a" aria-hidden="true"><svg><use href="#i-heart"/></svg></span>
      <span class="video-frame__heart video-frame__heart--b" aria-hidden="true"><svg><use href="#i-heart"/></svg></span>
    </div>

    <h2 class="section-title reveal"><span class="script" data-f="wishesTitle"></span></h2>
    <ol class="wishes" id="wishes"></ol>
  </section>

  <!-- ============ NUDGE ============ -->
  <section class="nudge" id="nudge">
    <div class="giftbox reveal" aria-hidden="true">
      <div class="giftbox__lid"><span class="giftbox__bow"></span></div>
      <div class="giftbox__body"></div>
      <span class="giftbox__spark s1"></span><span class="giftbox__spark s2"></span><span class="giftbox__spark s3"></span>
    </div>
    <h2 class="nudge__title reveal script" data-f="scrollNudgeTitle"></h2>
    <p class="nudge__text reveal" data-f="scrollNudge"></p>
    <div class="scroll-cue" aria-hidden="true"><svg><use href="#i-down"/></svg><svg><use href="#i-down"/></svg></div>
  </section>

  <!-- ============ GIFT 1: MEMORIES ============ -->
  <section class="memories" id="memories">
    <p class="gift-label reveal"><svg><use href="#i-camera"/></svg><span data-f="memoriesLabel"></span></p>
    <h2 class="section-title reveal"><span class="script" data-f="memoriesTitle"></span></h2>
    <p class="section-sub reveal" data-f="memoriesSub"></p>

    <div class="heart-collage" id="collage">
      <svg class="heart-collage__outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M50 94C50 94 4 64 4 32A22 22 0 0 1 50 20A22 22 0 0 1 96 32C96 64 50 94 50 94Z"/>
      </svg>
      <button class="heart-photo" id="heartPhoto" type="button"></button>
    </div>
    <p class="nudge-mini reveal">There's more… keep scrolling <svg><use href="#i-down"/></svg></p>
  </section>

  <!-- ============ GIFT 2: LETTER ============ -->
  <section class="letter-section" id="letter">
    <p class="gift-label reveal"><svg><use href="#i-heart"/></svg><span data-f="letterLabel"></span></p>
    <h2 class="section-title reveal"><span class="script" data-f="letterTitle"></span></h2>

    <article class="paper reveal">
      <span class="paper__tape paper__tape--l" aria-hidden="true"></span>
      <span class="paper__tape paper__tape--r" aria-hidden="true"></span>
      <p class="paper__greeting" data-f="letterGreeting"></p>
      <div class="paper__body" id="letterBody"></div>
      <p class="paper__closing" data-f="letterClosing"></p>
      <p class="paper__sign" data-f="herName"></p>
      <svg class="paper__seal" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 4C60 3 64 10 72 11S88 12 91 21 89 36 94 44 97 60 90 67 86 82 77 87 64 90 56 96 40 98 32 92 18 88 10 78 8 66 3 58 2 44 8 34 9 20 20 13 38 5 50 4Z" fill="url(#gWax)"/>
        <use href="#i-heart" x="30" y="31" width="40" height="40" fill="#ffd6e2" fill-opacity=".85"/>
      </svg>
    </article>
    <p class="nudge-mini reveal">One more gift… <svg><use href="#i-down"/></svg></p>
  </section>

  <!-- ============ GIFT 3: CINEMA ============ -->
  <section class="cinema" id="cinema">
    <p class="gift-label reveal"><svg><use href="#i-film"/></svg><span data-f="cinemaLabel"></span></p>
    <h2 class="section-title reveal"><span class="script" data-f="cinemaTitle"></span></h2>
    <p class="section-sub reveal" data-f="cinemaSub"></p>

    <div class="theater reveal" id="theater">
      <div class="marquee">
        <div class="marquee__bulbs" id="bulbs" aria-hidden="true"></div>
        <p class="marquee__small" data-f="nowShowing"></p>
        <p class="marquee__title" data-f="songTitle"></p>
      </div>
      <div class="stage">
        <div class="valance" aria-hidden="true"></div>
        <div class="screen" id="screen">
          <div class="screen__idle" id="screenIdle">
            <svg><use href="#i-heart"/></svg>
            <p id="screenIdleText">Our song is loading…</p>
          </div>
        </div>
        <div class="curtain curtain--l" aria-hidden="true"></div>
        <div class="curtain curtain--r" aria-hidden="true"></div>
        <div class="projector-beam" aria-hidden="true"></div>
      </div>
      <div class="seats" aria-hidden="true">
        <div class="seats__row" id="seatsBack"></div>
        <div class="seats__row seats__row--front" id="seatsFront"></div>
      </div>
      <button class="btn btn--glow cinema__play" id="playSong" type="button">
        <svg><use href="#i-play"/></svg><span data-f="playButton"></span>
      </button>
    </div>
  </section>

  <!-- ============ FINALE: I APPRECIATE YOU ============ -->
  <section class="finale" id="finale">
    <p class="kicker reveal" data-f="appreciateKicker"></p>
    <div class="big-heart reveal" aria-hidden="true">
      <svg><use href="#i-heart"/></svg>
      <span class="big-heart__ring"></span><span class="big-heart__ring big-heart__ring--2"></span>
    </div>
    <h2 class="finale__title shine reveal" data-f="appreciateTitle"></h2>
    <p class="section-sub reveal" data-f="appreciateSub"></p>

    <div class="reasons" id="reasons"></div>

    <div class="love-box reveal">
      <button class="love-btn" id="loveBtn" type="button">
        <svg><use href="#i-heart"/></svg>
      </button>
      <p class="love-box__label" data-f="loveButton"></p>
      <p class="love-box__count"><strong id="loveCount">0</strong> <span data-f="loveCounterLabel"></span></p>
    </div>

    <form class="reply reveal" id="replyForm" autocomplete="off">
      <h3 class="reply__title script" data-f="replyTitle"></h3>
      <input class="reply__name" id="replyName" maxlength="60" required>
      <textarea class="reply__msg" id="replyMsg" rows="4" maxlength="1500" required></textarea>
      <button class="btn btn--glow" type="submit" id="replySend">
        <svg><use href="#i-send"/></svg><span data-f="replyButton"></span>
      </button>
      <p class="reply__thanks" id="replyThanks" hidden><svg><use href="#i-heart"/></svg> <span data-f="replyThanks"></span></p>
    </form>

    <footer class="footer">
      <p class="footer__line script" data-f="closingLine"></p>
      <p class="footer__name" data-f="hisName"></p>
      <p class="footer__small"><span data-f="footer"></span> · <span data-f="madeBy"></span></p>
    </footer>
  </section>
</main>

<!-- Scroll progress heart -->
<div class="progress-heart" aria-hidden="true">
  <svg viewBox="0 0 32 32">
    <use href="#i-heart" class="progress-heart__bg"/>
    <use href="#i-heart" class="progress-heart__fill" clip-path="url(#clipProgress)"/>
  </svg>
</div>

<!-- Lightbox for memories -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <figure class="lightbox__card">
    <div class="lightbox__img" id="lightboxImg"></div>
    <figcaption id="lightboxCap"></figcaption>
  </figure>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
